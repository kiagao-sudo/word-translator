<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>单词翻译器</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 600px;
            padding: 40px;
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 30px;
            font-size: 28px;
        }

        .input-group {
            margin-bottom: 20px;
        }

        input[type="text"] {
            width: 100%;
            padding: 15px 20px;
            font-size: 16px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            outline: none;
            transition: border-color 0.3s;
        }

        input[type="text"]:focus {
            border-color: #667eea;
        }

        button {
            width: 100%;
            padding: 15px;
            font-size: 16px;
            font-weight: bold;
            color: white;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }

        button:active {
            transform: translateY(0);
        }

        button:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }

        .result {
            margin-top: 30px;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 10px;
            display: none;
        }

        .result.show {
            display: block;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .result h3 {
            color: #667eea;
            margin-bottom: 10px;
            font-size: 18px;
        }

        .result p {
            color: #333;
            line-height: 1.6;
            margin-bottom: 8px;
        }

        .result .phonetic {
            color: #666;
            font-style: italic;
            margin-bottom: 10px;
        }

        .copy-btn {
            margin-top: 15px;
            padding: 10px;
            font-size: 14px;
            background: #28a745;
            border-radius: 8px;
        }

        .history {
            margin-top: 30px;
            padding-top: 20px;
            border-top: 2px solid #e0e0e0;
        }

        .history h3 {
            color: #333;
            margin-bottom: 15px;
            font-size: 18px;
        }

        .history-item {
            padding: 10px;
            background: #f8f9fa;
            border-radius: 8px;
            margin-bottom: 8px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .history-item:hover {
            background: #e9ecef;
        }

        .history-item .word {
            font-weight: bold;
            color: #667eea;
        }

        .history-item .translation {
            color: #666;
            font-size: 14px;
        }

        .clear-history {
            margin-top: 15px;
            padding: 8px;
            font-size: 14px;
            background: #dc3545;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔤 单词翻译器</h1>

        <div class="input-group">
            <input type="text" id="wordInput" placeholder="输入单词，例如：hello" onkeypress="if(event.key==='Enter')translate()">
        </div>

        <button onclick="translate()" id="translateBtn">翻译</button>

        <div class="result" id="result">
            <h3 id="resultWord"></h3>
            <p class="phonetic" id="resultPhonetic"></p>
            <p id="resultTranslation"></p>
            <button class="copy-btn" onclick="copyTranslation()">📋 复制翻译</button>
        </div>

        <div class="history">
            <h3>📜 历史记录</h3>
            <div id="historyList"></div>
            <button class="clear-history" onclick="clearHistory()">🗑️ 清空历史</button>
        </div>
    </div>

    <script>
        let history = JSON.parse(localStorage.getItem('wordHistory')) || [];

        function updateHistoryUI() {
            const historyList = document.getElementById('historyList');
            historyList.innerHTML = '';

            history.slice(-10).reverse().forEach(item => {
                const historyItem = document.createElement('div');
                historyItem.className = 'history-item';
                historyItem.innerHTML = `
                    <div class="word">${item.word}</div>
                    <div class="translation">${item.translation}</div>
                `;
                historyItem.onclick = () => {
                    document.getElementById('wordInput').value = item.word;
                    translate();
                };
                historyList.appendChild(historyItem);
            });
        }

        async function translate() {
            const word = document.getElementById('wordInput').value.trim();
            if (!word) return;

            const btn = document.getElementById('translateBtn');
            const result = document.getElementById('result');

            btn.disabled = true;
            btn.textContent = '翻译中...';

            try {
                // 使用 MyMemory 免费翻译 API
                const response = await fetch(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(word)}&langpair=en|zh`);
                const data = await response.json();

                if (data.responseStatus === 200) {
                    const translation = data.responseData.translatedText;
                    const phonetic = data.responseData.phonetic || '';

                    document.getElementById('resultWord').textContent = word;
                    document.getElementById('resultPhonetic').textContent = phonetic;
                    document.getElementById('resultTranslation').textContent = translation;

                    result.classList.add('show');

                    // 添加到历史记录
                    history.push({ word, translation, timestamp: Date.now() });
                    localStorage.setItem('wordHistory', JSON.stringify(history));
                    updateHistoryUI();
                } else {
                    alert('翻译失败，请稍后再试');
                }
            } catch (error) {
                alert('网络错误，请检查连接');
                console.error(error);
            }

            btn.disabled = false;
            btn.textContent = '翻译';
        }

        function copyTranslation() {
            const translation = document.getElementById('resultTranslation').textContent;
            navigator.clipboard.writeText(translation).then(() => {
                alert('已复制到剪贴板！');
            });
        }

        function clearHistory() {
            if (confirm('确定要清空历史记录吗？')) {
                history = [];
                localStorage.removeItem('wordHistory');
                updateHistoryUI();
            }
        }

        // 初始化历史记录
        updateHistoryUI();
    </script>
</body>
</html>
